services:
  postgres:
    image: postgres:16-alpine
    container_name: codeersite-pg
    environment:
      POSTGRES_USER: codeersite
      POSTGRES_PASSWORD: codeersite_dev
      POSTGRES_DB: codeersite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeersite"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: codeersite-mongo
    environment:
      MONGO_INITDB_DATABASE: codeersite
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  mongodata:
