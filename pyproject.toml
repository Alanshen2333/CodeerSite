[project]
name = "codeersite"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    "pymongo>=4.0",
    "flask-jwt-extended>=4.0",
    "flask-cors>=5.0",
    "flask-bcrypt>=1.0",
    "marshmallow>=3.0",
    "marshmallow-sqlalchemy>=1.0",
    "alembic>=1.0",
    "mistune>=3.0",
    "flask-sqlalchemy>=3.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
